<%@ page contentType="text/html;charset=UTF-8" language="java" %>
<html>
<head>
    <title>班级管理系统</title>
    <style>
        /* 全局美化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 30px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #303133;
            margin-bottom: 25px;
            font-size: 24px;
        }

        /* 搜索栏样式 */
        .search-bar {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-bar input {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            width: 220px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #409eff;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #66b1ff;
        }
        .link {
            color: #409eff;
            text-decoration: none;
            font-size: 14px;
        }

        /* 添加表单样式 */
        .add-form {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #fafafa;
            border-radius: 6px;
        }
        .add-form h3 {
            margin-bottom: 15px;
            color: #606266;
            font-size: 16px;
        }
        .form-item {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-item label {
            width: 80px;
            text-align: right;
            color: #606266;
        }
        .form-item input {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            width: 220px;
        }

        /* 修改表单样式 */
        .edit-form {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #ecf5ff;
            border: 1px solid #b3d8ff;
            border-radius: 6px;
        }
        .edit-form h3 {
            margin-bottom: 15px;
            color: #409eff;
            font-size: 16px;
        }

        /* 表格样式 */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ebeef5;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border: 1px solid #ebeef5;
        }
        th {
            background-color: #f5f7fa;
            color: #909399;
            font-weight: 500;
        }
        tr:hover {
            background-color: #fafafa;
        }
        .op-link {
            margin: 0 8px;
            text-decoration: none;
            font-size: 14px;
        }
        .edit-link {
            color: #409eff;
        }
        .del-link {
            color: #f56c6c;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>班级管理系统（增删改查）</h1>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <span>搜索：</span>
        <input name="keyword" placeholder="输入班级编号/名称" form="searchForm">
        <button type="submit" form="searchForm" class="btn btn-primary">查询</button>
        <a href="/" class="link">显示全部</a>
    </div>
    <form id="searchForm" action="/" method="get"></form>

    <!-- 添加班级表单 -->
    <div class="add-form">
        <h3>添加班级</h3>
        <form action="/add" method="post">
            <div class="form-item">
                <label>班级编号：</label>
                <input name="classCode" required>
            </div>
            <div class="form-item">
                <label>班级名称：</label>
                <input name="className" required>
            </div>
            <button type="submit" class="btn btn-primary">添加班级</button>
        </form>
    </div>

    <!-- 动态区域1：修改表单 -->
    <%@ include file="editForm.jsp" %>

    <!-- 表格 -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>班级编号</th>
            <th>班级名称</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <%@ include file="tableRows.jsp" %>
        </tbody>
    </table>
</div>
</body>
</html>
