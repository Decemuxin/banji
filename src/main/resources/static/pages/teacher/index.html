<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统 - 教师管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* ===== 教师管理专属样式 ===== */
        .stat-number.green { color: #27ae60; }
        .stat-number.orange { color: #f39c12; }
        .stat-number.blue { color: #4A90D9; }
        .stat-number.purple { color: #8e44ad; }

        .title-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .title-badge.教授 { background: #cce5ff; color: #004085; }
        .title-badge.副教授 { background: #d4edda; color: #155724; }
        .title-badge.讲师 { background: #fff3cd; color: #856404; }
        .title-badge.助教 { background: #f8d7da; color: #721c24; }
        .title-badge.默认 { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="header">
    <div class="header-left">
        <h1>📚 班级管理系统</h1>
        <a href="/pages/clazz/index.html" class="nav-link">班级管理</a>
        <a href="/pages/student/index.html" class="nav-link">学生管理</a>
        <a href="/pages/score/index.html" class="nav-link">成绩管理</a>
        <a href="/pages/teacher/index.html" class="nav-link active">教师管理</a>
    </div>
    <div class="user-info">
        <span id="usernameDisplay">加载中...</span>
        <span class="role-badge" id="roleDisplay">加载中</span>
        <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>
</header>

<!-- ===== 主体 ===== -->
<div class="container">

    <!-- 统计卡片 -->
    <div class="stats">
        <div class="stat-card">
            <div class="label">👨‍🏫 教师总数</div>
            <div class="value stat-number blue" id="totalTeachers">0</div>
        </div>
        <div class="stat-card">
            <div class="label">🏫 院系数</div>
            <div class="value stat-number green" id="totalDepts">0</div>
        </div>
        <div class="stat-card">
            <div class="label">📊 职称数</div>
            <div class="value stat-number orange" id="totalTitles">0</div>
        </div>
        <div class="stat-card">
            <div class="label">📅 平均入职年限</div>
            <div class="value stat-number purple" id="avgYears">0</div>
        </div>
    </div>

    <!-- 职称分布 -->
    <div style="background:white;padding:16px 24px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
        <div style="font-size:14px;font-weight:600;color:#555;margin-bottom:8px;">📊 职称分布</div>
        <div id="titleStats" style="display:flex;flex-wrap:wrap;gap:12px;"></div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="🔍 搜索工号/姓名/院系/职称" onkeydown="if(event.key==='Enter') search()">
        <button class="btn btn-primary" onclick="search()">搜索</button>
        <button class="btn btn-secondary" onclick="resetSearch()">重置</button>

        <span class="spacer"></span>

        <!-- 管理员专属按钮 -->
        <div class="admin-only" id="adminTools" style="display:none;">
            <button class="btn btn-success" onclick="openAddModal()">➕ 新增教师</button>
            <button class="btn btn-danger" onclick="batchDelete()">🗑️ 批量删除</button>
        </div>

        <button class="btn btn-secondary" onclick="loadData()">🔄 刷新</button>
    </div>

    <!-- 表格 -->
    <div class="table-container">
        <table class="list-table">
            <thead>
            <tr>
                <th><input type="checkbox" class="checkbox" id="selectAll" onchange="toggleAll()"></th>
                <th>工号</th>
                <th>姓名</th>
                <th>性别</th>
                <th>手机号</th>
                <th>邮箱</th>
                <th>职称</th>
                <th>所属院系</th>
                <th>入职日期</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr class="empty-row"><td colspan="10">加载中...</td></tr>
            </tbody>
        </table>

        <!-- 分页 -->
        <div class="pagination">
            <div class="info" id="pageInfo">共 0 条</div>
            <div class="pages" id="pageButtons"></div>
        </div>
    </div>
</div>

<!-- ===== 新增/编辑模态框 ===== -->
<div class="modal-overlay" id="teacherModal">
    <div class="modal">
        <h2 id="modalTitle">新增教师</h2>
        <form id="teacherForm" onsubmit="saveTeacher(event)">
            <input type="hidden" id="editId" value="0">

            <div class="form-group">
                <label>工号 <span class="required">*</span></label>
                <input type="text" id="formTeacherNo" placeholder="请输入工号" required>
            </div>

            <div class="form-group">
                <label>姓名 <span class="required">*</span></label>
                <input type="text" id="formName" placeholder="请输入姓名" required>
            </div>

            <div class="form-group">
                <label>性别</label>
                <select id="formGender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="formPhone" placeholder="请输入手机号">
            </div>

            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="formEmail" placeholder="请输入邮箱">
            </div>

            <div class="form-group">
                <label>职称</label>
                <select id="formTitle">
                    <option value="教授">教授</option>
                    <option value="副教授">副教授</option>
                    <option value="讲师" selected>讲师</option>
                    <option value="助教">助教</option>
                </select>
            </div>

            <div class="form-group">
                <label>所属院系</label>
                <input type="text" id="formDepartment" placeholder="请输入所属院系">
            </div>

            <div class="form-group">
                <label>入职日期</label>
                <input type="date" id="formHireDate">
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="submit" class="btn-confirm">确认</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ============================================================
    //  全局变量
    // ============================================================
    let currentUser = null;
    let currentPage = 1;
    let pageSize = 10;
    let totalPages = 0;
    let selectedIds = new Set();
    let allData = [];

    // ============================================================
    //  初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        checkLogin();
        loadData();
        loadStatistics();
    });

    // ============================================================
    //  登录检查
    // ============================================================
    function checkLogin() {
        fetch('/api/user/current')
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = '/pages/user/login.html';
                    return;
                }
                currentUser = data;
                document.getElementById('usernameDisplay').textContent = data.username || '未知用户';
                document.getElementById('roleDisplay').textContent = data.role === 'admin' ? '管理员' : '普通用户';

                if (data.role === 'admin') {
                    document.getElementById('adminTools').style.display = 'inline-flex';
                }
            })
            .catch(() => {
                window.location.href = '/pages/user/login.html';
            });
    }

    // ============================================================
    //  退出登录
    // ============================================================
    function logout() {
        if (!confirm('确认退出登录？')) return;
        fetch('/api/user/logout')
            .then(() => { window.location.href = '/pages/user/login.html'; })
            .catch(() => { window.location.href = '/pages/user/login.html'; });
    }

    // ============================================================
    //  加载数据
    // ============================================================
    function loadData() {
        const keyword = document.getElementById('searchInput').value.trim();

        let url = '/api/teacher/list?page=' + currentPage + '&pageSize=' + pageSize;
        if (keyword) url += '&keyword=' + encodeURIComponent(keyword);

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    const result = data.data || {};
                    allData = result.list || [];
                    const total = result.total || 0;
                    totalPages = Math.ceil(total / pageSize);

                    renderTable(allData);
                    renderPagination(total);
                    selectedIds.clear();
                    document.getElementById('selectAll').checked = false;
                } else {
                    showError('加载数据失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                console.error(err);
                showError('网络异常，请稍后重试');
            });
    }

    // ============================================================
    //  渲染表格
    // ============================================================
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="10">暂无数据</td></tr>';
            return;
        }

        const isAdmin = currentUser && currentUser.role === 'admin';

        let html = '';
        data.forEach(item => {
            const checked = selectedIds.has(item.id) ? 'checked' : '';
            const titleClass = item.title || '默认';

            html += `
                    <tr class="${selectedIds.has(item.id) ? 'selected' : ''}">
                        <td><input type="checkbox" class="checkbox row-checkbox" value="${item.id}" ${checked} onchange="toggleRow(${item.id})"></td>
                        <td>${item.teacherNo || '-'}</td>
                        <td><strong>${item.name || '-'}</strong></td>
                        <td>${item.gender || '-'}</td>
                        <td>${item.phone || '-'}</td>
                        <td>${item.email || '-'}</td>
                        <td><span class="title-badge ${titleClass}">${item.title || '-'}</span></td>
                        <td>${item.department || '-'}</td>
                        <td>${formatDate(item.hireDate)}</td>
                        <td>
                            ${isAdmin ? `
                                <button class="btn-edit" onclick="openEditModal(${item.id})">修改</button>
                                <button class="btn-del" onclick="deleteTeacher(${item.id})">删除</button>
                            ` : `
                                <span class="readonly">只读</span>
                            `}
                        </td>
                    </tr>
                `;
        });

        tbody.innerHTML = html;
    }

    // ============================================================
    //  渲染分页
    // ============================================================
    function renderPagination(total) {
        document.getElementById('pageInfo').textContent = `共 ${total} 条  第 ${currentPage}/${totalPages || 1} 页`;

        const container = document.getElementById('pageButtons');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';
        html += `<button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;

        const start = Math.max(1, currentPage - 2);
        const end = Math.min(totalPages, currentPage + 2);

        if (start > 1) {
            html += `<button onclick="goPage(1)">1</button>`;
            if (start > 2) html += `<button disabled>...</button>`;
        }

        for (let i = start; i <= end; i++) {
            html += `<button onclick="goPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
        }

        if (end < totalPages) {
            if (end < totalPages - 1) html += `<button disabled>...</button>`;
            html += `<button onclick="goPage(${totalPages})">${totalPages}</button>`;
        }

        html += `<button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;

        container.innerHTML = html;
    }

    // ============================================================
    //  加载统计
    // ============================================================
    function loadStatistics() {
        fetch('/api/teacher/statistics')
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    const stats = data.data || {};
                    document.getElementById('totalTeachers').textContent = stats.total || 0;

                    // 职称分布
                    const titleStats = stats.titleStats || [];
                    const container = document.getElementById('titleStats');
                    if (titleStats.length === 0) {
                        container.innerHTML = '<span style="color:#999;font-size:13px;">暂无数据</span>';
                    } else {
                        let html = '';
                        let totalTitles = 0;
                        titleStats.forEach(t => {
                            totalTitles++;
                            const titleClass = t.title || '默认';
                            html += `
                                    <span style="background:#f0f4f8;padding:6px 16px;border-radius:20px;font-size:13px;">
                                        <span class="title-badge ${titleClass}">${t.title}</span>
                                        <strong style="margin-left:6px;">${t.count}</strong> 人
                                    </span>
                                `;
                        });
                        container.innerHTML = html;
                        document.getElementById('totalTitles').textContent = totalTitles;
                    }

                    // 院系数
                    const deptStats = stats.deptStats || [];
                    document.getElementById('totalDepts').textContent = deptStats.length || 0;

                    // 计算平均入职年限
                    let totalYears = 0;
                    let count = 0;
                    allData.forEach(t => {
                        if (t.hireDate) {
                            const hireYear = new Date(t.hireDate).getFullYear();
                            const currentYear = new Date().getFullYear();
                            totalYears += currentYear - hireYear;
                            count++;
                        }
                    });
                    document.getElementById('avgYears').textContent = count > 0 ? (totalYears / count).toFixed(1) + '年' : '0年';
                }
            })
            .catch(err => console.error('加载统计失败:', err));
    }

    // ============================================================
    //  分页跳转
    // ============================================================
    function goPage(page) {
        if (page < 1 || page > totalPages || page === currentPage) return;
        currentPage = page;
        loadData();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    //  搜索 / 重置
    // ============================================================
    function search() {
        currentPage = 1;
        loadData();
    }

    function resetSearch() {
        document.getElementById('searchInput').value = '';
        currentPage = 1;
        loadData();
    }

    // ============================================================
    //  复选框操作
    // ============================================================
    function toggleRow(id) {
        if (selectedIds.has(id)) {
            selectedIds.delete(id);
        } else {
            selectedIds.add(id);
        }
        updateSelectAllState();
        loadData();
    }

    function toggleAll() {
        const checked = document.getElementById('selectAll').checked;
        if (checked) {
            allData.forEach(s => selectedIds.add(s.id));
        } else {
            selectedIds.clear();
        }
        loadData();
    }

    function updateSelectAllState() {
        const allChecked = allData.every(s => selectedIds.has(s.id));
        document.getElementById('selectAll').checked = allChecked && allData.length > 0;
    }

    // ============================================================
    //  打开新增模态框
    // ============================================================
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '新增教师';
        document.getElementById('editId').value = '0';
        document.getElementById('teacherForm').reset();
        document.getElementById('formGender').value = '男';
        document.getElementById('formTitle').value = '讲师';
        document.getElementById('teacherModal').classList.add('show');
    }

    // ============================================================
    //  打开编辑模态框
    // ============================================================
    function openEditModal(id) {
        fetch('/api/teacher/' + id)
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    const t = data.data;
                    document.getElementById('modalTitle').textContent = '修改教师';
                    document.getElementById('editId').value = t.id;
                    document.getElementById('formTeacherNo').value = t.teacherNo || '';
                    document.getElementById('formName').value = t.name || '';
                    document.getElementById('formGender').value = t.gender || '男';
                    document.getElementById('formPhone').value = t.phone || '';
                    document.getElementById('formEmail').value = t.email || '';
                    document.getElementById('formTitle').value = t.title || '讲师';
                    document.getElementById('formDepartment').value = t.department || '';
                    document.getElementById('formHireDate').value = t.hireDate || '';
                    document.getElementById('teacherModal').classList.add('show');
                } else {
                    alert('获取教师信息失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  关闭模态框
    // ============================================================
    function closeModal() {
        document.getElementById('teacherModal').classList.remove('show');
    }

    // ============================================================
    //  保存教师（新增/编辑）
    // ============================================================
    function saveTeacher(event) {
        event.preventDefault();

        const id = parseInt(document.getElementById('editId').value);
        const teacherNo = document.getElementById('formTeacherNo').value.trim();
        const name = document.getElementById('formName').value.trim();
        const gender = document.getElementById('formGender').value;
        const phone = document.getElementById('formPhone').value.trim();
        const email = document.getElementById('formEmail').value.trim();
        const title = document.getElementById('formTitle').value;
        const department = document.getElementById('formDepartment').value.trim();
        const hireDate = document.getElementById('formHireDate').value;

        if (!teacherNo) { alert('请输入工号'); return; }
        if (!name) { alert('请输入姓名'); return; }

        const data = {
            teacherNo, name, gender, phone, email,
            title, department, hireDate: hireDate || null
        };

        const url = id > 0 ? '/api/teacher/update' : '/api/teacher/add';
        const method = id > 0 ? 'PUT' : 'POST';
        if (id > 0) data.id = id;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert(result.message);
                    closeModal();
                    loadData();
                    loadStatistics();
                } else {
                    alert('操作失败：' + (result.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  删除教师
    // ============================================================
    function deleteTeacher(id) {
        if (!confirm('确认删除该教师？')) return;

        fetch('/api/teacher/delete/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert(result.message);
                    loadData();
                    loadStatistics();
                } else {
                    alert('删除失败：' + (result.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  批量删除
    // ============================================================
    function batchDelete() {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) {
            alert('请先选择要删除的教师');
            return;
        }
        if (!confirm('确认删除选中的 ' + ids.length + ' 位教师？')) return;

        fetch('/api/teacher/batchDelete', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: ids })
        })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert(result.message);
                    selectedIds.clear();
                    loadData();
                    loadStatistics();
                } else {
                    alert('批量删除失败：' + (result.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        } catch (e) {
            return dateStr;
        }
    }

    function showError(msg) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="10">❌ ' + msg + '</td></tr>';
    }

    // ============================================================
    //  点击模态框外部关闭
    // ============================================================
    document.getElementById('teacherModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>

</body>
</html>
