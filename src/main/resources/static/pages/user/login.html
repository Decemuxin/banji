

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统 - 登录</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* ===== 登录卡片 ===== */
        .login-wrapper {
            display: flex;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            max-width: 960px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 左侧品牌区域 ===== */
        .login-brand {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 48px 40px;
            width: 42%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
        }

        .login-brand .brand-icon {
            font-size: 56px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .login-brand h1 {
            font-size: 32px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .login-brand p {
            font-size: 15px;
            opacity: 0.85;
            margin-top: 10px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .login-brand .brand-features {
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .login-brand .brand-features .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 14px;
            opacity: 0.9;
        }

        .login-brand .brand-features .feature-item span {
            background: rgba(255, 255, 255, 0.2);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        /* ===== 右侧登录表单 ===== */
        .login-form-area {
            padding: 48px 44px;
            width: 58%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-area .form-header {
            margin-bottom: 32px;
        }

        .login-form-area .form-header h2 {
            font-size: 26px;
            color: #333;
            font-weight: 700;
        }

        .login-form-area .form-header p {
            color: #888;
            font-size: 14px;
            margin-top: 6px;
        }

        .login-form-area .form-group {
            margin-bottom: 20px;
        }

        .login-form-area .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        .login-form-area .form-group .input-wrapper {
            position: relative;
        }

        .login-form-area .form-group .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 18px;
        }

        .login-form-area .form-group .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 46px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8f9fb;
            outline: none;
        }

        .login-form-area .form-group .input-wrapper input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .login-form-area .form-group .input-wrapper input::placeholder {
            color: #bbb;
        }

        .login-form-area .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .login-form-area .form-options label {
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .login-form-area .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
        }

        .login-form-area .form-options a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-form-area .form-options a:hover {
            text-decoration: underline;
        }

        .login-form-area .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-form-area .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }

        .login-form-area .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-form-area .login-error {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            min-height: 22px;
            font-weight: 500;
        }

        .login-form-area .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .login-form-area .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-form-area .login-footer a:hover {
            text-decoration: underline;
        }

        /* ===== 测试账号提示 ===== */
        .login-form-area .demo-accounts {
            margin-top: 24px;
            padding: 16px 20px;
            background: #f8f9fb;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #555;
        }

        .login-form-area .demo-accounts .demo-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-form-area .demo-accounts .demo-item .tag {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        .login-form-area .demo-accounts .demo-item .tag.admin-tag {
            background: #e74c3c;
        }

        .login-form-area .demo-accounts .demo-item .tag.user-tag {
            background: #27ae60;
        }

        .login-form-area .demo-accounts .demo-item .account-info {
            font-weight: 500;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 440px;
            }

            .login-brand {
                width: 100%;
                padding: 32px 28px;
                text-align: center;
            }

            .login-brand .brand-features {
                display: none;
            }

            .login-form-area {
                width: 100%;
                padding: 32px 28px;
            }
        }

        @media (max-width: 480px) {
            .login-form-area .demo-accounts {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <!-- ===== 左侧品牌区域 ===== -->
    <div class="login-brand">
        <div class="brand-icon">📚</div>
        <h1>班级管理系统</h1>
        <p>高效管理班级、学生、成绩与教师信息</p>
        <div class="brand-features">
            <div class="feature-item">
                <span>✓</span> 班级信息管理
            </div>
            <div class="feature-item">
                <span>✓</span> 学生档案管理
            </div>
            <div class="feature-item">
                <span>✓</span> 成绩录入与统计
            </div>
            <div class="feature-item">
                <span>✓</span> 教师信息管理
            </div>
        </div>
    </div>

    <!-- ===== 右侧登录表单 ===== -->
    <div class="login-form-area">
        <div class="form-header">
            <h2>👋 欢迎回来</h2>
            <p>请登录您的账号以继续使用</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="请输入用户名" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label>密码</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe"> 记住我
                </label>
                <a href="#">忘记密码？</a>
            </div>

            <div id="loginError" class="login-error"></div>

            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
        </form>

        <div class="login-footer">
            还没有账号？ <a href="register.html">立即注册</a>
        </div>

        <!-- ===== 测试账号提示 ===== -->
        <div class="demo-accounts">
            <div class="demo-item">
                <span class="tag admin-tag">管理员</span>
                <span class="account-info">111 / 111</span>
            </div>
            <div class="demo-item">
                <span class="tag user-tag">普通用户</span>
                <span class="account-info">222 / 222</span>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== 检查是否已登录 =====
    fetch("/api/user/current")
        .then(res => res.json())
        .then(data => {
            if (data.loggedIn) {
                window.location.href = "/pages/clazz/index.html";
            }
        })
        .catch(() => {});

    // ===== 登录表单提交 =====
    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorEl = document.getElementById("loginError");
        const btn = document.getElementById("loginBtn");

        if (!username || !password) {
            errorEl.textContent = "请输入用户名和密码";
            return;
        }

        btn.disabled = true;
        btn.textContent = "登录中...";
        errorEl.textContent = "";

        fetch("/api/user/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = "登 录";
                if (data.success) {
                    window.location.href = "/pages/clazz/index.html";
                } else {
                    errorEl.textContent = data.message || "登录失败，请重试";
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = "登 录";
                errorEl.textContent = "网络异常，请稍后重试";
                console.error(err);
            });
    });

    // ===== 回车键提交 =====
    document.getElementById("password").addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
            document.getElementById("loginForm").dispatchEvent(new Event("submit"));
        }
    });
</script>

</body>
</html>
