<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统 - 注册</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .register-container {
            max-width: 420px;
            margin: 60px auto;
            background: #fff;
            padding: 40px 45px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .register-title {
            text-align: center;
            font-size: 28px;
            color: #333;
            margin-bottom: 6px;
        }
        .register-subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .register-form-group {
            margin-bottom: 18px;
        }
        .register-form-group label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .register-form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .register-form-group input:focus {
            border-color: #4A90D9;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
        }
        .register-hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        .register-btn {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.3s;
        }
        .register-btn:hover { background: #1e8449; }
        .register-btn:disabled { background: #aaa; cursor: not-allowed; }
        .register-error { color: #e74c3c; font-size: 14px; text-align: center; margin-top: 12px; min-height: 22px; }
        .register-success { color: #27ae60; font-size: 14px; text-align: center; margin-top: 12px; min-height: 22px; }
        .register-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .register-footer a { color: #4A90D9; text-decoration: none; font-weight: 500; }
        .register-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="register-container">
    <h1 class="register-title">📝 注册新账号</h1>
    <p class="register-subtitle">创建你的班级管理账户</p>

    <form id="registerForm">
        <div class="register-form-group">
            <label>👤 用户名</label>
            <input type="text" id="username" placeholder="3-20个字符" required autofocus>
            <div class="register-hint">字母、数字或下划线，3-20个字符</div>
        </div>
        <div class="register-form-group">
            <label>🔒 密码</label>
            <input type="password" id="password" placeholder="至少6位" required>
            <div class="register-hint">至少6位，建议包含字母和数字</div>
        </div>
        <div class="register-form-group">
            <label>🔒 确认密码</label>
            <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
        </div>
        <div class="register-form-group">
            <label>📧 邮箱（选填）</label>
            <input type="email" id="email" placeholder="example@qq.com">
        </div>

        <div id="registerError" class="register-error"></div>
        <div id="registerSuccess" class="register-success"></div>

        <button type="submit" class="register-btn" id="registerBtn">注 册</button>
    </form>

    <div class="register-footer">
        已有账号？<a href="login2.html">立即登录</a>
    </div>
</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();
        const email = document.getElementById("email").value.trim();
        const errorEl = document.getElementById("registerError");
        const successEl = document.getElementById("registerSuccess");
        const btn = document.getElementById("registerBtn");

        errorEl.textContent = "";
        successEl.textContent = "";

        if (!username || !password || !confirmPassword) {
            errorEl.textContent = "请填写完整信息";
            return;
        }
        if (username.length < 3 || username.length > 20) {
            errorEl.textContent = "用户名长度必须在3-20个字符之间";
            return;
        }
        if (password.length < 6) {
            errorEl.textContent = "密码长度至少6位";
            return;
        }
        if (password !== confirmPassword) {
            errorEl.textContent = "两次输入的密码不一致";
            return;
        }

        btn.disabled = true;
        btn.textContent = "注册中...";

        fetch("/api/user/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, email })
        })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.textContent = "注 册";
                if (data.success) {
                    successEl.textContent = "✅ " + data.message;
                    setTimeout(() => { window.location.href = "login.html"; }, 1500);
                } else {
                    errorEl.textContent = data.message || "注册失败，请重试";
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = "注 册";
                errorEl.textContent = "网络异常，请稍后重试";
                console.error(err);
            });
    });
</script>

</body>
</html>
