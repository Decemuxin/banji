<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增班级</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="add-container">
    <h1 class="add-title">新增班级信息</h1>
    <form id="addForm">
        <div class="add-form-group">
            <label>班级编号：</label>
            <input type="text" id="code" placeholder="请输入班级编号" required>
        </div>
        <div class="add-form-group">
            <label>班级名称：</label>
            <input type="text" id="name" placeholder="请输入班级名称" required>
        </div>
        <div class="add-form-group">
            <label>年级：</label>
            <input type="number" id="grade" placeholder="请输入年级" required>
        </div>
        <div class="add-form-group">
            <label>专业：</label>
            <input type="text" id="major" placeholder="请输入专业" required>
        </div>
        <div class="add-form-group">
            <label>班主任：</label>
            <input type="text" id="teacher" placeholder="请输入班主任" required>
        </div>
        <div class="add-form-group">
            <label>成立时间：</label>
            <input type="date" id="time" required>
        </div>

        <div class="add-btn-group">
            <button type="submit">提交保存</button>
            <button type="button" onclick="history.back()">返回列表</button>
        </div>
    </form>
</div>

<script>
    // 表单提交
    document.getElementById("addForm").addEventListener("submit", function(e){
        e.preventDefault(); // 阻止默认刷新

        let data = {
            classCode: document.getElementById("code").value,
            className: document.getElementById("name").value,
            grade: parseInt(document.getElementById("grade").value),
            major: document.getElementById("major").value,
            headTeacher: document.getElementById("teacher").value,
            establishTime: document.getElementById("time").value
        };

        fetch("/api/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }).then(res => {
            if (res.ok) {
                alert("新增成功！");
                // 新增完成跳回列表页
                window.location.href = "index.html";
            } else {
                alert("新增失败！");
            }
        }).catch(err => {
            alert("请求异常：" + err);
        });
    });
</script>
</body>
</html>
