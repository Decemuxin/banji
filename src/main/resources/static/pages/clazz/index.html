


<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统 - 班级管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* ============================================================
                   全新样式 - 现代化卡片风格
                   ============================================================ */

        /* ----- 全局重置 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', sans-serif;
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        /* ===== 顶部导航 ===== */
        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 0 36px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar .nav-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .navbar .nav-left .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .navbar .nav-left .brand span {
            font-size: 28px;
        }

        .navbar .nav-links {
            display: flex;
            gap: 6px;
        }

        .navbar .nav-links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .navbar .nav-links a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .navbar .nav-links a.active {
            color: white;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .navbar .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .navbar .nav-right .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
        }

        .navbar .nav-right .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .navbar .nav-right .user-badge .role-tag {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            color: white;
        }

        .navbar .nav-right .user-badge .role-tag.admin {
            background: #e74c3c;
        }
        .navbar .nav-right .user-badge .role-tag.user {
            background: #27ae60;
        }

        .navbar .nav-right .logout-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .navbar .nav-right .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
            color: white;
            border-color: rgba(231, 76, 60, 0.3);
        }

        /* ===== 主体容器 ===== */
        .main-container {
            max-width: 1400px;
            margin: 28px auto;
            padding: 0 28px;
        }

        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            padding: 22px 24px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .stat-card .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-card .stat-label {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        .stat-card .stat-detail {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-card .stat-detail .tag {
            background: #f0f4f8;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .stat-card .stat-detail .tag.grade-tag {
            background: #e8f0fe;
            color: #4A90D9;
        }

        .stat-card .stat-detail .tag.major-tag {
            background: #e8f8e8;
            color: #27ae60;
        }

        /* ===== 工具栏 ===== */
        .toolbar {
            background: white;
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .toolbar input {
            padding: 10px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            background: #f8f9fb;
            width: 280px;
        }

        .toolbar input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .toolbar .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toolbar .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .toolbar .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
        }

        .toolbar .btn-success {
            background: #27ae60;
            color: white;
        }

        .toolbar .btn-success:hover {
            background: #1e8449;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.35);
        }

        .toolbar .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .toolbar .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.35);
        }

        .toolbar .btn-warning {
            background: #f39c12;
            color: white;
        }

        .toolbar .btn-warning:hover {
            background: #d68910;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.35);
        }

        .toolbar .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .toolbar .btn-secondary:hover {
            background: #7f8c8d;
        }

        .toolbar .spacer {
            flex: 1;
        }

        .toolbar .admin-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== 表格容器 ===== */
        .table-wrapper {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table-wrapper thead {
            background: #f8f9fb;
        }

        .table-wrapper th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #eee;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .table-wrapper td {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }

        .table-wrapper tbody tr {
            transition: background 0.2s;
        }

        .table-wrapper tbody tr:hover {
            background: #f8f9fb;
        }

        .table-wrapper tbody tr.selected {
            background: #e8f0fe;
        }

        .table-wrapper td .btn-edit {
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            margin-right: 4px;
        }

        .table-wrapper td .btn-edit:hover {
            background: #5a6fd6;
        }

        .table-wrapper td .btn-del {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .table-wrapper td .btn-del:hover {
            background: #c0392b;
        }

        .table-wrapper td .readonly {
            color: #bbb;
            font-size: 13px;
        }

        .table-wrapper th input[type="checkbox"],
        .table-wrapper td input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .empty-row td {
            text-align: center;
            padding: 50px;
            color: #bbb;
            font-size: 16px;
        }

        /* ===== 分页 ===== */
        .pagination {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid #eee;
        }

        .pagination .info {
            color: #888;
            font-size: 14px;
        }

        .pagination .pages {
            display: flex;
            gap: 4px;
        }

        .pagination .pages button {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #555;
        }

        .pagination .pages button:hover:not(:disabled) {
            background: #f0f4f8;
            border-color: #667eea;
        }

        .pagination .pages button.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .pagination .pages button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .list-footer {
            padding: 12px 24px;
            color: #888;
            font-size: 14px;
            border-top: 1px solid #eee;
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 32px 40px;
            max-width: 520px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
        }

        .modal h3 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .modal .modal-desc {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-group label {
            display: block;
            font-weight: 500;
            color: #555;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8ecf1;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            background: #f8f9fb;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .modal .modal-actions button {
            padding: 10px 32px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal .modal-actions .btn-confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .modal .modal-actions .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
        }

        .modal .modal-actions .btn-cancel {
            background: #e8ecf1;
            color: #555;
        }

        .modal .modal-actions .btn-cancel:hover {
            background: #d5d9e0;
        }

        /* ===== 批量新增弹窗表格 ===== */
        .batch-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 12px 0;
        }

        .batch-table th,
        .batch-table td {
            padding: 6px 8px;
            border: 1px solid #e8ecf1;
            text-align: center;
        }

        .batch-table th {
            background: #f8f9fb;
            font-weight: 600;
            color: #555;
            font-size: 12px;
        }

        .batch-table input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #e8ecf1;
            border-radius: 6px;
            font-size: 13px;
            background: #f8f9fb;
            outline: none;
            transition: all 0.3s;
        }

        .batch-table input:focus {
            border-color: #667eea;
            background: white;
        }

        .btn-remove-row {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .btn-remove-row:hover {
            background: #c0392b;
        }

        .modal-wide {
            max-width: 950px;
            min-width: auto;
            padding: 28px 32px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 992px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 20px;
                gap: 10px;
            }

            .navbar .nav-left {
                flex-wrap: wrap;
                gap: 12px;
            }

            .navbar .nav-links {
                flex-wrap: wrap;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar input {
                width: 100%;
            }

            .toolbar .admin-btns {
                flex-wrap: wrap;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            .modal {
                padding: 24px;
            }

            .modal-wide {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .navbar .nav-links a {
                padding: 6px 12px;
                font-size: 13px;
            }

            .navbar .nav-right .user-badge {
                font-size: 12px;
                padding: 4px 12px 4px 8px;
            }

            .stat-card .stat-number {
                font-size: 24px;
            }
        }

        /* ===== 隐藏工具 ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- ============================================================
顶部导航
============================================================ -->
<nav class="navbar">
    <div class="nav-left">
        <div class="brand">
            <span>📚</span> 班级管理系统
        </div>
        <div class="nav-links">
            <a href="/pages/clazz/index.html" class="active">班级管理</a>
            <a href="/pages/student/index.html">学生管理</a>
            <a href="/pages/score/index.html">成绩管理</a>
            <a href="/pages/teacher/index.html">教师管理</a>
        </div>
    </div>
    <div class="nav-right" id="headerRight">
        <!-- 由 JavaScript 动态渲染 -->
    </div>
</nav>

<!-- ============================================================
主体
============================================================ -->
<div class="main-container">

    <!-- 统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="statTotal">0</div>
            <div class="stat-label">📊 班级总数</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">📅 各年级分布</div>
            <div class="stat-detail" id="gradeList"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">🏫 各专业分布</div>
            <div class="stat-detail" id="majorList"></div>
        </div>
        <div class="stat-card">
            <div class="stat-label">📈 最近更新</div>
            <div class="stat-detail" id="lastUpdate" style="color:#999;font-size:13px;">加载中...</div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <input type="text" id="kw" placeholder="🔍 搜索：编号 / 名称 / 专业">
        <button class="btn btn-primary" onclick="searchData()">搜索</button>
        <button class="btn btn-secondary" onclick="loadData(); loadStats();">刷新</button>

        <span class="spacer"></span>

        <div class="admin-btns hidden" id="adminButtons">
            <button class="btn btn-success" onclick="toAdd()">➕ 新增</button>
            <button class="btn btn-success" onclick="showBatchAdd()">📥 批量新增</button>
            <button class="btn btn-danger" onclick="batchDelete()">🗑️ 批量删除</button>
            <button class="btn btn-warning" onclick="showBatchUpdate()">✏️ 批量修改</button>
        </div>
    </div>

    <!-- 表格 -->
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th style="width:40px;"><input type="checkbox" id="checkAll" onchange="toggleAll()"></th>
                <th>ID</th>
                <th>编号</th>
                <th>名称</th>
                <th>年级</th>
                <th>专业</th>
                <th>班主任</th>
                <th>成立时间</th>
                <th style="width:160px;">操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr class="empty-row"><td colspan="9">加载中...</td></tr>
            </tbody>
        </table>

        <div class="pagination">
            <div class="info" id="pageInfo">共 0 条</div>
            <div class="pages" id="pageButtons"></div>
        </div>

        <div class="list-footer">
            <span id="selectedInfo">已选 0 项</span>
        </div>
    </div>
</div>

<!-- ============================================================
批量修改弹窗
============================================================ -->
<div class="modal-overlay" id="updateModal">
    <div class="modal">
        <h3>✏️ 批量修改</h3>
        <p class="modal-desc">已选中 <span id="modalCount">0</span> 条记录</p>
        <div class="form-group">
            <label>修改字段</label>
            <select id="updateField">
                <option value="grade">年级</option>
                <option value="headTeacher">班主任</option>
            </select>
        </div>
        <div class="form-group">
            <label>新值</label>
            <input type="text" id="updateValue" placeholder="请输入新值">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">取消</button>
            <button class="btn-confirm" onclick="confirmUpdate()">确认修改</button>
        </div>
    </div>
</div>

<!-- ============================================================
批量新增弹窗
============================================================ -->
<div class="modal-overlay" id="batchAddModal">
    <div class="modal modal-wide">
        <h3>📥 批量新增班级</h3>
        <p class="modal-desc">每行一条记录，带 <span style="color:red;">*</span> 为必填</p>

        <table class="batch-table">
            <thead>
            <tr>
                <th style="width:14%;">班级编号<span style="color:red;">*</span></th>
                <th style="width:14%;">班级名称<span style="color:red;">*</span></th>
                <th style="width:10%;">年级<span style="color:red;">*</span></th>
                <th style="width:18%;">专业<span style="color:red;">*</span></th>
                <th style="width:14%;">班主任</th>
                <th style="width:18%;">成立时间</th>
                <th style="width:12%;">操作</th>
            </tr>
            </thead>
            <tbody id="batchAddTableBody">
            <tr>
                <td><input type="text" class="ba-code" placeholder="如: JY001"></td>
                <td><input type="text" class="ba-name" placeholder="如: 计科一班"></td>
                <td><input type="number" class="ba-grade" placeholder="如: 2025"></td>
                <td><input type="text" class="ba-major" placeholder="如: 计算机科学"></td>
                <td><input type="text" class="ba-teacher" placeholder="班主任姓名"></td>
                <td><input type="date" class="ba-time"></td>
                <td><button class="btn-remove-row" onclick="removeBatchRow(this)">✕</button></td>
            </tr>
            <tr>
                <td><input type="text" class="ba-code" placeholder="如: JY002"></td>
                <td><input type="text" class="ba-name" placeholder="如: 计科二班"></td>
                <td><input type="number" class="ba-grade" placeholder="如: 2025"></td>
                <td><input type="text" class="ba-major" placeholder="如: 计算机科学"></td>
                <td><input type="text" class="ba-teacher" placeholder="班主任姓名"></td>
                <td><input type="date" class="ba-time"></td>
                <td><button class="btn-remove-row" onclick="removeBatchRow(this)">✕</button></td>
            </tr>
            </tbody>
        </table>

        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px;">
            <button class="btn btn-primary" onclick="addBatchRow()">➕ 添加一行</button>
            <button class="btn btn-success" onclick="submitBatchAdd()">✅ 提交全部</button>
            <button class="btn btn-secondary" onclick="closeBatchAdd()">取消</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 页面加载
    // ============================================================
    let currentUser = null;

    window.onload = function() {
        fetch("/api/user/current")
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = "/pages/user/login.html";
                    return;
                }
                currentUser = data;
                renderHeader();
                loadData();
                loadStats();
            })
            .catch(() => {
                window.location.href = "/pages/user/login.html";
            });
    };

    // ============================================================
    // 渲染顶部导航（右侧用户信息）
    // ============================================================
    function renderHeader() {
        const container = document.getElementById("headerRight");
        const isAdmin = currentUser && currentUser.role === "admin";
        const roleLabel = isAdmin ? "管理员" : "普通用户";
        const roleClass = isAdmin ? "admin" : "user";
        const initial = currentUser.username ? currentUser.username.charAt(0).toUpperCase() : "U";

        container.innerHTML = `
                <div class="user-badge">
                    <div class="avatar">${initial}</div>
                    <span>${currentUser.username}</span>
                    <span class="role-tag ${roleClass}">${roleLabel}</span>
                </div>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            `;

        const adminBtns = document.getElementById("adminButtons");
        if (isAdmin) {
            adminBtns.classList.remove("hidden");
            adminBtns.style.display = "flex";
        } else {
            adminBtns.classList.add("hidden");
            adminBtns.style.display = "none";
        }
    }

    // ============================================================
    // 退出登录
    // ============================================================
    function logout() {
        if (!confirm("确认退出登录吗？")) return;
        fetch("/api/user/logout")
            .then(() => {
                window.location.href = "/pages/user/login.html";
            });
    }

    // ============================================================
    // 加载数据
    // ============================================================
    function loadData() {
        fetch("/api/list")
            .then(res => {
                if (res.status === 401) {
                    window.location.href = "/pages/user/login.html";
                    return;
                }
                return res.json();
            })
            .then(data => {
                if (data) renderTable(data);
                updateSelected();
            })
            .catch(err => console.error("加载失败", err));
    }

    // ============================================================
    // 渲染表格
    // ============================================================
    function renderTable(data) {
        let html = "";
        const isAdmin = currentUser && currentUser.role === "admin";

        if (!data || data.length === 0) {
            html = `<tr class="empty-row"><td colspan="9">📭 暂无数据</td></tr>`;
        } else {
            data.forEach(item => {
                let time = item.establishTime ? item.establishTime.split("T")[0] : "";
                html += `
                        <tr>
                            <td><input type="checkbox" class="rowCb" value="${item.id}" onchange="updateSelected()"></td>
                            <td>${item.id}</td>
                            <td><strong>${item.classCode}</strong></td>
                            <td>${item.className}</td>
                            <td>${item.grade}</td>
                            <td>${item.major}</td>
                            <td>${item.headTeacher}</td>
                            <td>${time}</td>
                            <td>
                                ${isAdmin ? `<button class="btn-edit" onclick="editPage(${item.id})">修改</button>` : ''}
                                ${isAdmin ? `<button class="btn-del" onclick="deleteOne(${item.id})">删除</button>` : '<span class="readonly">只读</span>'}
                            </td>
                        </tr>
                    `;
            });
        }
        document.getElementById("tableBody").innerHTML = html;
        document.getElementById("checkAll").checked = false;
    }

    // ============================================================
    // 搜索
    // ============================================================
    function searchData() {
        let kw = document.getElementById("kw").value.trim();
        if (kw === "") { loadData(); return; }
        fetch("/api/list?keyword=" + kw)
            .then(res => res.json())
            .then(data => { renderTable(data);
                updateSelected(); });
    }

    // ============================================================
    // 跳转
    // ============================================================
    function toAdd() { window.location.href = "add.html"; }

    function editPage(id) { window.location.href = "edit.html?id=" + id; }

    // ============================================================
    // 单个删除
    // ============================================================
    function deleteOne(id) {
        if (!confirm("确定删除？")) return;
        fetch("/api/delete?id=" + id)
            .then(res => {
                if (res.ok) { alert("✅ 删除成功");
                    loadData();
                    loadStats(); } else alert("❌ 删除失败");
            });
    }

    // ============================================================
    // 全选
    // ============================================================
    function toggleAll() {
        let checked = document.getElementById("checkAll").checked;
        document.querySelectorAll(".rowCb").forEach(cb => cb.checked = checked);
        updateSelected();
    }

    // ============================================================
    // 更新已选数量
    // ============================================================
    function updateSelected() {
        let count = document.querySelectorAll(".rowCb:checked").length;
        document.getElementById("selectedInfo").textContent = "已选 " + count + " 项";
    }

    // ============================================================
    // 获取选中ID
    // ============================================================
    function getIds() {
        let cbs = document.querySelectorAll(".rowCb:checked");
        return Array.from(cbs).map(cb => parseInt(cb.value));
    }

    // ============================================================
    // 批量删除
    // ============================================================
    function batchDelete() {
        let ids = getIds();
        if (ids.length === 0) { alert("⚠️ 请至少选择一条记录！"); return; }
        if (!confirm("确定删除选中的 " + ids.length + " 条记录？")) return;
        fetch("/api/batchDelete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(ids)
        }).then(res => {
            if (res.ok) {
                alert("✅ 删除成功！共 " + ids.length + " 条");
                loadData();
                loadStats();
            } else {
                alert("❌ 批量删除失败");
            }
        });
    }

    // ============================================================
    // 批量修改
    // ============================================================
    function showBatchUpdate() {
        let ids = getIds();
        if (ids.length === 0) { alert("⚠️ 请至少选择一条记录！"); return; }
        document.getElementById("modalCount").textContent = ids.length;
        document.getElementById("updateModal").classList.add("show");
        document.getElementById("updateValue").value = "";
    }

    function closeModal() {
        document.getElementById("updateModal").classList.remove("show");
    }

    function confirmUpdate() {
        let ids = getIds();
        let field = document.getElementById("updateField").value;
        let value = document.getElementById("updateValue").value.trim();
        if (!value) { alert("⚠️ 请输入新值！"); return; }

        let url = "";
        let body = { ids: ids };

        if (field === "grade") {
            if (isNaN(value) || !Number.isInteger(Number(value))) {
                alert("⚠️ 年级请输入整数！");
                return;
            }
            url = "/api/batchUpdateGrade";
            body.newGrade = parseInt(value);
        } else {
            url = "/api/batchUpdateTeacher";
            body.newTeacher = value;
        }

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        }).then(res => {
            if (res.ok) {
                alert("✅ 修改成功！共 " + ids.length + " 条");
                closeModal();
                loadData();
                loadStats();
            } else {
                alert("❌ 批量修改失败");
            }
        });
    }

    // ============================================================
    // 加载统计
    // ============================================================
    function loadStats() {
        fetch("/api/statistics")
            .then(res => res.json())
            .then(data => {
                document.getElementById("statTotal").textContent = data.total || 0;

                let gHtml = "";
                if (data.gradeStats && data.gradeStats.length > 0) {
                    data.gradeStats.forEach(item => {
                        gHtml += `<span class="tag grade-tag">${item.grade}级 ${item.count}个</span>`;
                    });
                } else { gHtml = "<span style='color:#ccc;'>暂无</span>"; }
                document.getElementById("gradeList").innerHTML = gHtml;

                let mHtml = "";
                if (data.majorStats && data.majorStats.length > 0) {
                    data.majorStats.forEach(item => {
                        mHtml += `<span class="tag major-tag">${item.major} ${item.count}个</span>`;
                    });
                } else { mHtml = "<span style='color:#ccc;'>暂无</span>"; }
                document.getElementById("majorList").innerHTML = mHtml;

                document.getElementById("lastUpdate").textContent = new Date().toLocaleString();
            })
            .catch(err => console.error("统计加载失败", err));
    }

    // ============================================================
    // 弹窗关闭（点击外部）
    // ============================================================
    document.getElementById("updateModal").addEventListener("click", function(e) {
        if (e.target === this) closeModal();
    });
    document.getElementById("batchAddModal").addEventListener("click", function(e) {
        if (e.target === this) closeBatchAdd();
    });

    // ============================================================
    // 批量新增
    // ============================================================
    function showBatchAdd() {
        document.getElementById("batchAddModal").classList.add("show");
    }

    function closeBatchAdd() {
        document.getElementById("batchAddModal").classList.remove("show");
    }

    function addBatchRow() {
        let tbody = document.getElementById("batchAddTableBody");
        let tr = document.createElement("tr");
        tr.innerHTML = `
                <td><input type="text" class="ba-code" placeholder="如: JY001"></td>
                <td><input type="text" class="ba-name" placeholder="如: 计科一班"></td>
                <td><input type="number" class="ba-grade" placeholder="如: 2025"></td>
                <td><input type="text" class="ba-major" placeholder="如: 计算机科学"></td>
                <td><input type="text" class="ba-teacher" placeholder="班主任姓名"></td>
                <td><input type="date" class="ba-time"></td>
                <td><button class="btn-remove-row" onclick="removeBatchRow(this)">✕</button></td>
            `;
        tbody.appendChild(tr);
    }

    function removeBatchRow(btn) {
        let tr = btn.closest("tr");
        let tbody = document.getElementById("batchAddTableBody");
        if (tbody.children.length <= 1) {
            alert("至少保留一行！");
            return;
        }
        tr.remove();
    }

    function submitBatchAdd() {
        let rows = document.querySelectorAll("#batchAddTableBody tr");
        let dataList = [];
        let hasError = false;

        rows.forEach(tr => {
            let code = tr.querySelector(".ba-code").value.trim();
            let name = tr.querySelector(".ba-name").value.trim();
            let grade = tr.querySelector(".ba-grade").value.trim();
            let major = tr.querySelector(".ba-major").value.trim();
            let teacher = tr.querySelector(".ba-teacher").value.trim();
            let time = tr.querySelector(".ba-time").value;

            if (!code || !name || !grade || !major) {
                hasError = true;
                return;
            }
            dataList.push({
                classCode: code,
                className: name,
                grade: parseInt(grade),
                major: major,
                headTeacher: teacher || "",
                establishTime: time || new Date().toISOString().split("T")[0]
            });
        });

        if (hasError) {
            alert("⚠️ 请填写完整信息（编号、名称、年级、专业为必填）！");
            return;
        }
        if (dataList.length === 0) {
            alert("⚠️ 没有有效数据可提交！");
            return;
        }
        if (!confirm("确认提交 " + dataList.length + " 条数据吗？")) return;

        fetch("/api/batchAdd", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataList)
        }).then(res => {
            if (res.ok) {
                alert("✅ 批量新增成功！共 " + dataList.length + " 条");
                closeBatchAdd();
                loadData();
                loadStats();
            } else {
                alert("❌ 批量新增失败！");
            }
        }).catch(err => {
            alert("❌ 请求异常：" + err);
        });
    }
</script>

</body>
</html>
