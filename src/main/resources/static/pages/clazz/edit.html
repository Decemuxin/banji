<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改班级</title>
    <!-- 引用同一个全局样式表 -->
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="edit-container">
    <h1 class="edit-title">修改班级信息</h1>
    <form id="editForm">
        <input type="hidden" id="editId">

        <div class="edit-form-group">
            <label>班级编号：</label>
            <input type="text" id="editCode" required>
        </div>
        <div class="edit-form-group">
            <label>班级名称：</label>
            <input type="text" id="editName" required>
        </div>
        <div class="edit-form-group">
            <label>年级：</label>
            <input type="number" id="editGrade" required>
        </div>
        <div class="edit-form-group">
            <label>专业：</label>
            <input type="text" id="editMajor" required>
        </div>
        <div class="edit-form-group">
            <label>班主任：</label>
            <input type="text" id="editTeacher" required>
        </div>
        <div class="edit-form-group">
            <label>成立时间：</label>
            <input type="date" id="editTime" required>
        </div>

        <div class="edit-btn-group">
            <button type="submit">保存修改</button>
            <button type="button" onclick="history.back()">取消</button>
        </div>
    </form>
</div>

<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (!id) {
            alert("参数错误！");
            history.back();
            return;
        }

        fetch(`/api/get?id=${id}`)
            .then(res => res.json())
            .then(item => {
                document.getElementById("editId").value = item.id;
                document.getElementById("editCode").value = item.classCode;
                document.getElementById("editName").value = item.className;
                document.getElementById("editGrade").value = item.grade;
                document.getElementById("editMajor").value = item.major;
                document.getElementById("editTeacher").value = item.headTeacher;
                document.getElementById("editTime").value = item.establishTime.split("T")[0];
            });
    }

    document.getElementById("editForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const data = {
            id: parseInt(document.getElementById("editId").value),
            classCode: document.getElementById("editCode").value,
            className: document.getElementById("editName").value,
            grade: parseInt(document.getElementById("editGrade").value),
            major: document.getElementById("editMajor").value,
            headTeacher: document.getElementById("editTeacher").value,
            establishTime: document.getElementById("editTime").value
        };

        fetch("/api/update", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }).then(res => {
            if (res.ok) {
                alert("修改成功！");
                window.location.href = "index.html";
            } else {
                alert("修改失败！");
            }
        });
    });
</script>
</body>
</html>
