<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级管理系统 - 学生管理</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* ===== 页面专属样式 ===== */
        /* 学生管理页面特有样式，目前全部使用公共样式，无需额外添加 */
        /* 如有特殊需求可在此添加 */
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="header">
    <div class="header-left">
        <h1>📚 班级管理系统</h1>
        <a href="/pages/clazz/index.html" class="nav-link">班级管理</a>
        <a href="/pages/student/index.html" class="nav-link active">学生管理</a>
        <a href="/pages/score/index.html" class="nav-link">成绩管理</a>
        <a href="/pages/teacher/index.html" class="nav-link">教师管理</a>   <!-- 新增 -->
    </div>
    <div class="user-info">
        <span id="usernameDisplay">加载中...</span>
        <span class="role-badge" id="roleDisplay">加载中</span>
        <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>
</header>

<!-- ===== 主体 ===== -->
<div class="container">

    <!-- 统计卡片 -->
    <div class="stats">
        <div class="stat-card">
            <div class="label">👨‍🎓 学生总数</div>
            <div class="value" id="totalStudents">0</div>
        </div>
        <div class="stat-card">
            <div class="label">📖 在读</div>
            <div class="value" id="totalActive">0</div>
        </div>
        <div class="stat-card">
            <div class="label">📚 休学</div>
            <div class="value" id="totalSuspended">0</div>
        </div>
        <div class="stat-card">
            <div class="label">🎓 毕业</div>
            <div class="value" id="totalGraduated">0</div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="🔍 搜索姓名/学号" onkeydown="if(event.key==='Enter') search()">
        <select id="clazzFilter" onchange="search()">
            <option value="">全部班级</option>
        </select>
        <button class="btn btn-primary" onclick="search()">搜索</button>
        <button class="btn btn-secondary" onclick="resetSearch()">重置</button>

        <span class="spacer"></span>

        <!-- 管理员专属按钮 -->
        <div class="admin-only" id="adminTools" style="display:none;">
            <button class="btn btn-success" onclick="openAddModal()">➕ 新增学生</button>
            <button class="btn btn-danger" onclick="batchDelete()">🗑️ 批量删除</button>
        </div>

        <button class="btn btn-secondary" onclick="loadData()">🔄 刷新</button>
    </div>

    <!-- 表格 -->
    <div class="table-container">
        <table class="list-table">
            <thead>
            <tr>
                <th><input type="checkbox" class="checkbox" id="selectAll" onchange="toggleAll()"></th>
                <th>学号</th>
                <th>姓名</th>
                <th>性别</th>
                <th>手机号</th>
                <th>邮箱</th>
                <th>所属班级</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr class="empty-row"><td colspan="10">加载中...</td></tr>
            </tbody>
        </table>

        <!-- 分页 -->
        <div class="pagination">
            <div class="info" id="pageInfo">共 0 条</div>
            <div class="pages" id="pageButtons"></div>
        </div>
    </div>
</div>

<!-- ===== 新增/编辑模态框 ===== -->
<div class="modal-overlay" id="studentModal">
    <div class="modal">
        <h2 id="modalTitle">新增学生</h2>
        <form id="studentForm" onsubmit="saveStudent(event)">
            <input type="hidden" id="editId" value="0">

            <div class="form-group">
                <label>学号 <span class="required">*</span></label>
                <input type="text" id="formStudentNo" placeholder="请输入学号" required>
            </div>

            <div class="form-group">
                <label>姓名 <span class="required">*</span></label>
                <input type="text" id="formName" placeholder="请输入姓名" required>
            </div>

            <div class="form-group">
                <label>性别</label>
                <select id="formGender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="formPhone" placeholder="请输入手机号">
            </div>

            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="formEmail" placeholder="请输入邮箱">
            </div>

            <div class="form-group">
                <label>所属班级</label>
                <select id="formClazzId">
                    <option value="">请选择班级</option>
                </select>
            </div>

            <div class="form-group">
                <label>状态</label>
                <select id="formStatus">
                    <option value="在读">在读</option>
                    <option value="休学">休学</option>
                    <option value="毕业">毕业</option>
                    <option value="退学">退学</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="submit" class="btn-confirm">确认</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ============================================================
    //  全局变量
    // ============================================================
    let currentUser = null;
    let currentPage = 1;
    let pageSize = 10;
    let totalPages = 0;
    let selectedIds = new Set();
    let allData = [];

    // ============================================================
    //  初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        checkLogin();
        loadClazzOptions();
        loadData();
    });

    // ============================================================
    //  登录检查
    // ============================================================
    function checkLogin() {
        fetch('/api/user/current')
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) {
                    window.location.href = '/pages/user/login.html';
                    return;
                }
                currentUser = data;
                document.getElementById('usernameDisplay').textContent = data.username || '未知用户';
                document.getElementById('roleDisplay').textContent = data.role === 'admin' ? '管理员' : '普通用户';

                if (data.role === 'admin') {
                    document.getElementById('adminTools').style.display = 'inline-flex';
                }
            })
            .catch(() => {
                window.location.href = '/pages/user/login.html';
            });
    }

    // ============================================================
    //  退出登录
    // ============================================================
    function logout() {
        if (!confirm('确认退出登录？')) return;
        fetch('/api/user/logout')
            .then(() => { window.location.href = '/pages/user/login.html'; })
            .catch(() => { window.location.href = '/pages/user/login.html'; });
    }

    // ============================================================
    //  加载班级下拉选项
    // ============================================================
    function loadClazzOptions() {
        fetch('/api/student/clazz/list')
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    const clazzList = data.data || [];
                    const filterSelect = document.getElementById('clazzFilter');
                    const formSelect = document.getElementById('formClazzId');

                    filterSelect.innerHTML = '<option value="">全部班级</option>';
                    formSelect.innerHTML = '<option value="">请选择班级</option>';

                    clazzList.forEach(c => {
                        const displayName = c.className + (c.grade ? ' (' + c.grade + '级)' : '');
                        const opt1 = document.createElement('option');
                        opt1.value = c.id;
                        opt1.textContent = displayName;
                        filterSelect.appendChild(opt1);

                        const opt2 = document.createElement('option');
                        opt2.value = c.id;
                        opt2.textContent = displayName;
                        formSelect.appendChild(opt2);
                    });
                }
            })
            .catch(err => console.error('加载班级列表失败:', err));
    }

    // ============================================================
    //  加载数据
    // ============================================================
    function loadData() {
        const keyword = document.getElementById('searchInput').value.trim();
        const clazzId = document.getElementById('clazzFilter').value;

        let url = '/api/student/list?page=' + currentPage + '&pageSize=' + pageSize;
        if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
        if (clazzId) url += '&clazzId=' + clazzId;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    const result = data.data || {};
                    allData = result.list || [];
                    const total = result.total || 0;
                    totalPages = Math.ceil(total / pageSize);

                    renderTable(allData);
                    renderPagination(total);
                    updateStats(allData);
                    selectedIds.clear();
                    document.getElementById('selectAll').checked = false;
                } else {
                    showError('加载数据失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                console.error(err);
                showError('网络异常，请稍后重试');
            });
    }

    // ============================================================
    //  渲染表格
    // ============================================================
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="10">暂无数据</td></tr>';
            return;
        }

        const isAdmin = currentUser && currentUser.role === 'admin';

        let html = '';
        data.forEach(student => {
            const checked = selectedIds.has(student.id) ? 'checked' : '';
            const statusClass = student.status || '在读';

            html += `
                    <tr class="${selectedIds.has(student.id) ? 'selected' : ''}">
                        <td><input type="checkbox" class="checkbox row-checkbox" value="${student.id}" ${checked} onchange="toggleRow(${student.id})"></td>
                        <td>${student.studentNo || '-'}</td>
                        <td><strong>${student.name || '-'}</strong></td>
                        <td>${student.gender || '-'}</td>
                        <td>${student.phone || '-'}</td>
                        <td>${student.email || '-'}</td>
                        <td>${student.clazzName || '未分配'}</td>
                        <td><span class="status-badge ${statusClass}">${statusClass}</span></td>
                        <td>${formatDate(student.createTime)}</td>
                        <td>
                            ${isAdmin ? `
                                <button class="btn-edit" onclick="openEditModal(${student.id})">修改</button>
                                <button class="btn-del" onclick="deleteStudent(${student.id})">删除</button>
                            ` : `
                                <span class="readonly">只读</span>
                            `}
                        </td>
                    </tr>
                `;
        });

        tbody.innerHTML = html;
    }

    // ============================================================
    //  渲染分页
    // ============================================================
    function renderPagination(total) {
        document.getElementById('pageInfo').textContent = `共 ${total} 条  第 ${currentPage}/${totalPages || 1} 页`;

        const container = document.getElementById('pageButtons');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';
        html += `<button onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>上一页</button>`;

        const start = Math.max(1, currentPage - 2);
        const end = Math.min(totalPages, currentPage + 2);

        if (start > 1) {
            html += `<button onclick="goPage(1)">1</button>`;
            if (start > 2) html += `<button disabled>...</button>`;
        }

        for (let i = start; i <= end; i++) {
            html += `<button onclick="goPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
        }

        if (end < totalPages) {
            if (end < totalPages - 1) html += `<button disabled>...</button>`;
            html += `<button onclick="goPage(${totalPages})">${totalPages}</button>`;
        }

        html += `<button onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>下一页</button>`;

        container.innerHTML = html;
    }

    // ============================================================
    //  统计更新
    // ============================================================
    function updateStats(data) {
        const total = data.length;
        let active = 0,
            suspended = 0,
            graduated = 0,
            dropped = 0;

        data.forEach(s => {
            const status = s.status || '在读';
            if (status === '在读') active++;
            else if (status === '休学') suspended++;
            else if (status === '毕业') graduated++;
            else if (status === '退学') dropped++;
        });

        // 使用 .value 类（来自公共样式）
        document.getElementById('totalStudents').textContent = total;
        document.getElementById('totalActive').textContent = active;
        document.getElementById('totalSuspended').textContent = suspended;
        document.getElementById('totalGraduated').textContent = graduated;
    }

    // ============================================================
    //  分页跳转
    // ============================================================
    function goPage(page) {
        if (page < 1 || page > totalPages || page === currentPage) return;
        currentPage = page;
        loadData();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    //  搜索 / 重置
    // ============================================================
    function search() {
        currentPage = 1;
        loadData();
    }

    function resetSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('clazzFilter').value = '';
        currentPage = 1;
        loadData();
    }

    // ============================================================
    //  复选框操作
    // ============================================================
    function toggleRow(id) {
        if (selectedIds.has(id)) {
            selectedIds.delete(id);
        } else {
            selectedIds.add(id);
        }
        updateSelectAllState();
        loadData();
    }

    function toggleAll() {
        const checked = document.getElementById('selectAll').checked;
        if (checked) {
            allData.forEach(s => selectedIds.add(s.id));
        } else {
            selectedIds.clear();
        }
        loadData();
    }

    function updateSelectAllState() {
        const allChecked = allData.every(s => selectedIds.has(s.id));
        document.getElementById('selectAll').checked = allChecked && allData.length > 0;
    }

    // ============================================================
    //  打开新增模态框
    // ============================================================
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '新增学生';
        document.getElementById('editId').value = '0';
        document.getElementById('studentForm').reset();
        document.getElementById('formGender').value = '男';
        document.getElementById('formStatus').value = '在读';
        document.getElementById('formClazzId').value = '';
        document.getElementById('studentModal').classList.add('show');
    }

    // ============================================================
    //  打开编辑模态框
    // ============================================================
    function openEditModal(id) {
        fetch('/api/student/' + id)
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    const s = data.data;
                    document.getElementById('modalTitle').textContent = '编辑学生';
                    document.getElementById('editId').value = s.id;
                    document.getElementById('formStudentNo').value = s.studentNo || '';
                    document.getElementById('formName').value = s.name || '';
                    document.getElementById('formGender').value = s.gender || '男';
                    document.getElementById('formPhone').value = s.phone || '';
                    document.getElementById('formEmail').value = s.email || '';
                    document.getElementById('formClazzId').value = s.clazzId || '';
                    document.getElementById('formStatus').value = s.status || '在读';
                    document.getElementById('studentModal').classList.add('show');
                } else {
                    alert('获取学生信息失败：' + (data.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  关闭模态框
    // ============================================================
    function closeModal() {
        document.getElementById('studentModal').classList.remove('show');
    }

    // ============================================================
    //  保存学生（新增/编辑）
    // ============================================================
    function saveStudent(event) {
        event.preventDefault();

        const id = parseInt(document.getElementById('editId').value);
        const studentNo = document.getElementById('formStudentNo').value.trim();
        const name = document.getElementById('formName').value.trim();
        const gender = document.getElementById('formGender').value;
        const phone = document.getElementById('formPhone').value.trim();
        const email = document.getElementById('formEmail').value.trim();
        const clazzId = document.getElementById('formClazzId').value;
        const status = document.getElementById('formStatus').value;

        if (!studentNo) { alert('请输入学号'); return; }
        if (!name) { alert('请输入姓名'); return; }

        const data = { studentNo, name, gender, phone, email, clazzId: clazzId || null, status };

        const url = id > 0 ? '/api/student/update' : '/api/student/add';
        const method = id > 0 ? 'PUT' : 'POST';
        if (id > 0) data.id = id;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert(result.message);
                    closeModal();
                    loadData();
                } else {
                    alert('操作失败：' + (result.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  删除学生
    // ============================================================
    function deleteStudent(id) {
        if (!confirm('确认删除该学生？')) return;

        fetch('/api/student/delete/' + id, { method: 'DELETE' })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert(result.message);
                    loadData();
                } else {
                    alert('删除失败：' + (result.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  批量删除
    // ============================================================
    function batchDelete() {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) {
            alert('请先选择要删除的学生');
            return;
        }
        if (!confirm('确认删除选中的 ' + ids.length + ' 名学生？')) return;

        fetch('/api/student/batchDelete', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ids: ids })
        })
            .then(res => res.json())
            .then(result => {
                if (result.code === 200) {
                    alert(result.message);
                    selectedIds.clear();
                    loadData();
                } else {
                    alert('批量删除失败：' + (result.message || '未知错误'));
                }
            })
            .catch(err => {
                alert('网络异常，请稍后重试');
                console.error(err);
            });
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const d = new Date(dateStr);
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        } catch (e) {
            return dateStr;
        }
    }

    function showError(msg) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '<tr class="empty-row"><td colspan="10">❌ ' + msg + '</td></tr>';
    }

    // ============================================================
    //  点击模态框外部关闭
    // ============================================================
    document.getElementById('studentModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>

</body>
</html>
